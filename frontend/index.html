<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Menu — Hotels & Dining . Kenya</title>
  <meta name="description"
    content="Discover the finest hotels and restaurants in Kenya. Browse menus, compare prices, and book rooms instantly." />
  <meta name="theme-color" content="#0f0e0c" />
  <link rel="icon" href="/favicon.ico" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Digital Menu — Hotels & Dining" />
  <meta property="og:description"
    content="Browse menus, compare prices, and book rooms at the best hotels in Kenya." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0e0c;
      --surface: #1a1814;
      --border: #2e2b26;
      --gold: #c9a96e;
      --gold-dim: #7a6040;
      --text: #f0ece4;
      --muted: #8a8070;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
    }

    #root {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: var(--bg);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .s-mark {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(2rem, 7vw, 4rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
      animation: fadeUp 0.8s ease both;
    }

    .s-mark em {
      font-style: italic;
      color: var(--gold);
    }

    .s-rule {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      animation: fadeUp 0.8s 0.15s ease both;
    }

    .s-rule::before,
    .s-rule::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
    }

    .s-diamond {
      width: 5px;
      height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    .s-tag {
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      animation: fadeUp 0.8s 0.3s ease both;
    }

    .s-dots {
      display: flex;
      gap: 5px;
      animation: fadeUp 0.8s 0.45s ease both;
    }

    .s-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold-dim);
      animation: dot 1.4s ease-in-out infinite;
    }

    .s-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .s-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dot {

      0%,
      100% {
        opacity: 0.25;
        transform: scale(0.75);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
        background: var(--gold);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    ::selection {
      background: var(--gold);
      color: var(--bg);
    }
  </style>
</head>

<body>
  <div id="splash" role="status" aria-label="Loading">
    <p class="s-mark">Digital&nbsp;<em>Menu</em></p>
    <div class="s-rule">
      <div class="s-diamond"></div>
    </div>
    <p class="s-tag">Hotels &amp; Dining &middot; Kenya</p>
    <div class="s-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
  <div id="root"></div>
  <script>
    (function () {
      var s = document.getElementById('splash'), r = document.getElementById('root');
      var o = new MutationObserver(function () { if (r.children.length > 0) { s.classList.add('hidden'); o.disconnect(); } });
      o.observe(r, { childList: true });
      setTimeout(function () { s.classList.add('hidden'); }, 4000);
    }());
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
